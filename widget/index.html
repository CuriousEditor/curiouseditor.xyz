<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Curious Widget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000F08">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --seal:#000F08;
    --seal-2:#04160D;
    --orange:#FB3640;
    --orange-2:#FF6169;
    --sage:#FB3640;
    --sage-2:#FF9198;
    --cream:#F5F1ED;
    --line: rgba(245,241,237,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--seal);
    font-family:'Helvetica Neue', Arial, sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .app{
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:row;
  }
  /* CLOCK PANEL */
  .clock-panel{
    flex:0 0 30%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    background: radial-gradient(circle at 50% 45%, #1A0509 0%, var(--seal) 70%);
    padding: 10px 10px;
    height:100%;
  }
  .time{
    font-family:'SF Mono','Courier New',monospace;
    font-weight:700;
    font-size:9vw;
    line-height:1;
    color:var(--cream);
    letter-spacing:-1px;
    text-align:center;
  }
  .ampm{
    font-family:'SF Mono','Courier New',monospace;
    font-size:2.6vw;
    color:var(--sage);
    margin-top:6px;
    letter-spacing:4px;
  }
  .date{
    margin-top:10px;
    font-size:2vw;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--orange-2);
    font-weight:600;
    text-align:center;
  }
  .brand{
    position:absolute;
    top:14px;
    left:16px;
    font-size:1.8vw;
    letter-spacing:2px;
    text-transform:uppercase;
    color:rgba(245,241,237,0.35);
    font-weight:600;
  }
  .divider{
    width:3px;
    height:100%;
    flex-shrink:0;
    background:linear-gradient(180deg, var(--orange), var(--sage));
  }
  /* TODO PANEL */
  .todo-panel{
    flex:1;
    background:var(--seal-2);
    display:flex;
    flex-direction:column;
    min-height:0;
    height:100%;
  }
  .todo-header{
    padding:16px 20px 8px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-shrink:0;
  }
  .todo-title{
    color:var(--cream);
    font-size:19px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  .todo-count{
    color:var(--sage);
    font-size:13px;
    font-weight:600;
  }
  .todo-list{
    flex:1;
    overflow-y:auto;
    padding: 4px 16px 6px;
  }
  .task{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 8px;
    border-bottom:1px solid var(--line);
  }
  .checkbox{
    width:21px;
    height:21px;
    flex-shrink:0;
    border-radius:6px;
    border:2px solid var(--orange-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .checkbox.checked{
    background:var(--sage);
    border-color:var(--sage);
  }
  .checkbox svg{
    width:13px; height:13px;
    display:none;
  }
  .checkbox.checked svg{ display:block; }
  .task-text{
    flex:1;
    color:var(--cream);
    font-size:15px;
    word-break:break-word;
  }
  .task.done .task-text{
    color:rgba(245,241,237,0.4);
    text-decoration:line-through;
  }
  .del-btn{
    color:rgba(245,241,237,0.3);
    font-size:18px;
    background:none;
    border:none;
    padding:4px 6px;
    line-height:1;
  }
  .empty{
    color:rgba(245,241,237,0.35);
    text-align:center;
    margin-top:30px;
    font-size:14px;
  }
  .add-row{
    flex-shrink:0;
    display:flex;
    gap:8px;
    padding:10px 14px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:var(--seal-2);
  }
  #newTask{
    flex:1;
    background:rgba(245,241,237,0.08);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--cream);
    font-size:15px;
    padding:11px 14px;
    outline:none;
  }
  #newTask::placeholder{ color:rgba(245,241,237,0.35); }
  #addBtn{
    background:var(--orange);
    border:none;
    color:var(--seal);
    font-weight:700;
    font-size:22px;
    width:44px;
    border-radius:10px;
  }
  #addBtn:active{ background:var(--orange-2); }

  /* POMODORO PANEL */
  .pomo-panel{
    flex:0 0 26%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background: radial-gradient(circle at 50% 55%, #1A0509 0%, var(--seal) 70%);
    padding: 10px 10px;
    height:100%;
    position:relative;
    overflow:hidden;
  }
  .pomo-panel.flash{
    animation: pomoFlash 0.9s ease-in-out 4;
  }
  @keyframes pomoFlash{
    0%, 100% { background-color: transparent; }
    50% { background-color: var(--orange); }
  }
  .pomo-alert{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%) translateY(-10px);
    background:var(--orange);
    color:var(--seal);
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:8px 16px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space:nowrap;
  }
  .pomo-alert.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .pomo-label{
    font-size:1.8vw;
    letter-spacing:3px;
    text-transform:uppercase;
    color:rgba(245,241,237,0.35);
    font-weight:600;
  }
  .pomo-time{
    font-family:'SF Mono','Courier New',monospace;
    font-weight:700;
    font-size:7vw;
    color:var(--cream);
    letter-spacing:-1px;
  }
  .pomo-mode{
    font-size:2vw;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--orange-2);
    font-weight:600;
  }
  .pomo-controls{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .pomo-btn{
    background:rgba(245,241,237,0.08);
    border:1px solid var(--line);
    color:var(--cream);
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:9px 14px;
    border-radius:20px;
  }
  .pomo-btn.primary{
    background:var(--orange);
    border-color:var(--orange);
    color:var(--seal);
  }
  .pomo-btn:active{ opacity:0.75; }

  /* PORTRAIT: stack vertically instead of 3 columns */
  @media (orientation: portrait){
    .app{
      flex-direction:column;
    }
    .clock-panel{
      flex:0 0 30%;
      width:100%;
      padding: 10px 0 16px;
    }
    .time{ font-size:15vw; }
    .ampm{ font-size:4.5vw; }
    .date{ font-size:3.4vw; margin-top:12px; }
    .brand{ font-size:3vw; top:16px; left:20px; }
    .divider{
      width:100%;
      height:3px;
      background:linear-gradient(90deg, var(--orange), var(--sage));
    }
    .todo-panel{
      flex:1;
      width:100%;
    }
    .pomo-panel{
      flex:0 0 auto;
      width:100%;
      padding: 14px 10px calc(14px + env(safe-area-inset-bottom));
      flex-direction:row;
      justify-content:space-around;
      gap:0;
    }
    .pomo-col{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
    }
    .pomo-label{ font-size:3vw; }
    .pomo-time{ font-size:9vw; }
    .pomo-mode{ font-size:3vw; }
    .pomo-controls{ margin-top:0; }
    .pomo-btn{ font-size:12px; padding:10px 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="clock-panel">
    <div class="brand">Curious Editor</div>
    <div class="time" id="time">00:00</div>
    <div class="ampm" id="ampm">AM</div>
    <div class="date" id="date">Loading</div>
  </div>
  <div class="divider"></div>
  <div class="todo-panel">
    <div class="todo-header">
      <div class="todo-title">Today</div>
      <div class="todo-count" id="count">0 left</div>
    </div>
    <div class="todo-list" id="list"></div>
    <div class="add-row">
      <input id="newTask" type="text" placeholder="Add a task" maxlength="120" />
      <button id="addBtn">+</button>
    </div>
  </div>
  <div class="divider"></div>
  <div class="pomo-panel">
    <div class="pomo-alert" id="pomoAlert">Time's up!</div>
    <div class="pomo-col">
      <div class="pomo-label">Pomodoro</div>
      <div class="pomo-time" id="pomoTime">25:00</div>
      <div class="pomo-mode" id="pomoMode">Focus</div>
    </div>
    <div class="pomo-controls">
      <button class="pomo-btn" id="pomoReset">Reset</button>
      <button class="pomo-btn primary" id="pomoStart">Start</button>
    </div>
  </div>
</div>

<script>
  function pad(n){ return n.toString().padStart(2,'0'); }
  function updateClock(){
    var now = new Date();
    var h = now.getHours();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    document.getElementById('time').textContent = pad(h12) + ':' + pad(now.getMinutes());
    document.getElementById('ampm').textContent = ampm + '  ·  ' + pad(now.getSeconds());
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('date').textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Pomodoro timer
  var POMO_WORK = 25 * 60;
  var POMO_BREAK = 5 * 60;
  var pomoRemaining = POMO_WORK;
  var pomoRunning = false;
  var pomoMode = 'focus';
  var pomoInterval = null;

  function formatPomo(s){
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return pad(m) + ':' + pad(sec);
  }
  function renderPomo(){
    document.getElementById('pomoTime').textContent = formatPomo(pomoRemaining);
    document.getElementById('pomoMode').textContent = pomoMode === 'focus' ? 'Focus' : 'Break';
    document.getElementById('pomoStart').textContent = pomoRunning ? 'Pause' : 'Start';
  }
  function playBeep(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var now = ctx.currentTime;
      [0, 0.35, 0.7].forEach(function(offset){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.3, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.28);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.3);
      });
    }catch(e){ /* audio not available */ }
  }
  function showAlert(msg){
    var alertEl = document.getElementById('pomoAlert');
    var panel = document.querySelector('.pomo-panel');
    alertEl.textContent = msg;
    alertEl.classList.add('show');
    panel.classList.add('flash');
    setTimeout(function(){
      alertEl.classList.remove('show');
      panel.classList.remove('flash');
    }, 3600);
  }
  function tickPomo(){
    if(pomoRemaining > 0){
      pomoRemaining--;
      renderPomo();
    } else {
      if(pomoMode === 'focus'){
        pomoMode = 'break';
        pomoRemaining = POMO_BREAK;
        showAlert("Focus done — take a break!");
      } else {
        pomoMode = 'focus';
        pomoRemaining = POMO_WORK;
        showAlert("Break over — back to focus!");
      }
      renderPomo();
      playBeep();
      try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]); }catch(e){}
    }
  }
  function startPausePomo(){
    pomoRunning = !pomoRunning;
    if(pomoRunning){
      pomoInterval = setInterval(tickPomo, 1000);
    } else {
      clearInterval(pomoInterval);
    }
    renderPomo();
  }
  function resetPomo(){
    pomoRunning = false;
    clearInterval(pomoInterval);
    pomoMode = 'focus';
    pomoRemaining = POMO_WORK;
    renderPomo();
  }
  document.getElementById('pomoStart').onclick = startPausePomo;
  document.getElementById('pomoReset').onclick = resetPomo;
  renderPomo();

  var STORAGE_KEY = 'curious_widget_tasks_v1';
  var tasks = [];
  try{
    var saved = localStorage.getItem(STORAGE_KEY);
    if(saved) tasks = JSON.parse(saved);
  }catch(e){ tasks = []; }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }catch(e){}
  }

  function render(){
    var list = document.getElementById('list');
    list.innerHTML = '';
    if(tasks.length === 0){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No tasks yet. Add one below.';
      list.appendChild(e);
    } else {
      tasks.forEach(function(t, i){
        var row = document.createElement('div');
        row.className = 'task' + (t.done ? ' done' : '');

        var box = document.createElement('div');
        box.className = 'checkbox' + (t.done ? ' checked' : '');
        box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#000F08" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
        box.onclick = function(){ tasks[i].done = !tasks[i].done; save(); render(); };

        var text = document.createElement('div');
        text.className = 'task-text';
        text.textContent = t.text;

        var del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '\u00D7';
        del.onclick = function(){ tasks.splice(i,1); save(); render(); };

        row.appendChild(box);
        row.appendChild(text);
        row.appendChild(del);
        list.appendChild(row);
      });
    }
    var left = tasks.filter(function(t){ return !t.done; }).length;
    document.getElementById('count').textContent = left + (left === 1 ? ' left' : ' left');
  }

  function addTask(){
    var input = document.getElementById('newTask');
    var v = input.value.trim();
    if(!v) return;
    tasks.push({ text: v, done: false });
    input.value = '';
    save();
    render();
  }

  document.getElementById('addBtn').onclick = addTask;
  document.getElementById('newTask').addEventListener('keydown', function(e){
    if(e.key === 'Enter') addTask();
  });

  render();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  // Keep screen awake while the widget is open
  var wakeLock = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', function(){ wakeLock = null; });
      }
    }catch(e){ /* wake lock not available or denied, ignore */ }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      requestWakeLock();
    }
  });
</script>
</body>
</html>
