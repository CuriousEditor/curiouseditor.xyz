<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Curious Widget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2B1B12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --seal:#2B1B12;
    --seal-2:#3B2417;
    --orange:#C1440E;
    --orange-2:#E06A2D;
    --sage:#9CAF88;
    --sage-2:#C3D2B4;
    --cream:#F4EFE6;
    --line: rgba(244,239,230,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--seal);
    font-family:'Helvetica Neue', Arial, sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .app{
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:column;
  }
  /* CLOCK HALF */
  .clock-half{
    flex:0 0 42%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    background:var(--seal);
    padding: 10px 0 24px;
  }
  .time{
    font-family:'SF Mono','Courier New',monospace;
    font-weight:700;
    font-size:16vw;
    line-height:1;
    color:var(--cream);
    letter-spacing:-2px;
  }
  .ampm{
    font-family:'SF Mono','Courier New',monospace;
    font-size:5vw;
    color:var(--sage);
    margin-top:4px;
    letter-spacing:6px;
  }
  .date{
    margin-top:14px;
    font-size:3.6vw;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--orange-2);
    font-weight:600;
  }
  .brand{
    position:absolute;
    top:16px;
    left:20px;
    font-size:3vw;
    letter-spacing:2px;
    text-transform:uppercase;
    color:rgba(244,239,230,0.35);
    font-weight:600;
  }
  .divider{
    height:3px;
    background:linear-gradient(90deg, var(--orange), var(--sage));
    flex-shrink:0;
  }
  /* TODO HALF */
  .todo-half{
    flex:1;
    background:var(--seal-2);
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  /* LANDSCAPE LAYOUT: side by side */
  @media (orientation: landscape){
    .app{
      flex-direction:row;
    }
    .clock-half{
      flex:0 0 40%;
      height:100%;
      padding: 10px 16px 24px;
    }
    .time{
      font-size:8.5vw;
      letter-spacing:-1px;
    }
    .ampm{
      font-size:2.6vw;
      letter-spacing:4px;
    }
    .date{
      font-size:2vw;
      letter-spacing:2px;
      margin-top:10px;
    }
    .brand{
      font-size:1.6vw;
      top:14px;
      left:16px;
    }
    .divider{
      width:3px;
      height:100%;
      background:linear-gradient(180deg, var(--orange), var(--sage));
    }
    .todo-half{
      flex:1;
      height:100%;
    }
    .todo-header{
      padding:14px 20px 8px;
    }
    .todo-list{
      padding: 2px 16px 6px;
    }
    .task{
      padding:9px 8px;
    }
  }
  .todo-header{
    padding:18px 20px 10px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-shrink:0;
  }
  .todo-title{
    color:var(--cream);
    font-size:20px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  .todo-count{
    color:var(--sage);
    font-size:13px;
    font-weight:600;
  }
  .todo-list{
    flex:1;
    overflow-y:auto;
    padding: 4px 14px 8px;
  }
  .task{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 8px;
    border-bottom:1px solid var(--line);
  }
  .checkbox{
    width:22px;
    height:22px;
    flex-shrink:0;
    border-radius:6px;
    border:2px solid var(--orange-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .checkbox.checked{
    background:var(--sage);
    border-color:var(--sage);
  }
  .checkbox svg{
    width:14px; height:14px;
    display:none;
  }
  .checkbox.checked svg{ display:block; }
  .task-text{
    flex:1;
    color:var(--cream);
    font-size:15.5px;
    word-break:break-word;
  }
  .task.done .task-text{
    color:rgba(244,239,230,0.4);
    text-decoration:line-through;
  }
  .del-btn{
    color:rgba(244,239,230,0.3);
    font-size:18px;
    background:none;
    border:none;
    padding:4px 6px;
    line-height:1;
  }
  .empty{
    color:rgba(244,239,230,0.35);
    text-align:center;
    margin-top:30px;
    font-size:14px;
  }
  .add-row{
    flex-shrink:0;
    display:flex;
    gap:8px;
    padding:10px 14px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:var(--seal-2);
  }
  #newTask{
    flex:1;
    background:rgba(244,239,230,0.08);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--cream);
    font-size:15px;
    padding:11px 14px;
    outline:none;
  }
  #newTask::placeholder{ color:rgba(244,239,230,0.35); }
  #addBtn{
    background:var(--orange);
    border:none;
    color:var(--cream);
    font-weight:700;
    font-size:22px;
    width:44px;
    border-radius:10px;
  }
  #addBtn:active{ background:var(--orange-2); }
</style>
</head>
<body>
<div class="app">
  <div class="clock-half">
    <div class="brand">Curious Editor</div>
    <div class="time" id="time">00:00</div>
    <div class="ampm" id="ampm">AM</div>
    <div class="date" id="date">Loading</div>
  </div>
  <div class="divider"></div>
  <div class="todo-half">
    <div class="todo-header">
      <div class="todo-title">Today</div>
      <div class="todo-count" id="count">0 left</div>
    </div>
    <div class="todo-list" id="list"></div>
    <div class="add-row">
      <input id="newTask" type="text" placeholder="Add a task" maxlength="120" />
      <button id="addBtn">+</button>
    </div>
  </div>
</div>

<script>
  function pad(n){ return n.toString().padStart(2,'0'); }
  function updateClock(){
    var now = new Date();
    var h = now.getHours();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    document.getElementById('time').textContent = pad(h12) + ':' + pad(now.getMinutes());
    document.getElementById('ampm').textContent = ampm + '  ·  ' + pad(now.getSeconds());
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('date').textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
  }
  updateClock();
  setInterval(updateClock, 1000);

  var STORAGE_KEY = 'curious_widget_tasks_v1';
  var tasks = [];
  try{
    var saved = localStorage.getItem(STORAGE_KEY);
    if(saved) tasks = JSON.parse(saved);
  }catch(e){ tasks = []; }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }catch(e){}
  }

  function render(){
    var list = document.getElementById('list');
    list.innerHTML = '';
    if(tasks.length === 0){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No tasks yet. Add one below.';
      list.appendChild(e);
    } else {
      tasks.forEach(function(t, i){
        var row = document.createElement('div');
        row.className = 'task' + (t.done ? ' done' : '');

        var box = document.createElement('div');
        box.className = 'checkbox' + (t.done ? ' checked' : '');
        box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#2B1B12" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
        box.onclick = function(){ tasks[i].done = !tasks[i].done; save(); render(); };

        var text = document.createElement('div');
        text.className = 'task-text';
        text.textContent = t.text;

        var del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '\u00D7';
        del.onclick = function(){ tasks.splice(i,1); save(); render(); };

        row.appendChild(box);
        row.appendChild(text);
        row.appendChild(del);
        list.appendChild(row);
      });
    }
    var left = tasks.filter(function(t){ return !t.done; }).length;
    document.getElementById('count').textContent = left + (left === 1 ? ' left' : ' left');
  }

  function addTask(){
    var input = document.getElementById('newTask');
    var v = input.value.trim();
    if(!v) return;
    tasks.push({ text: v, done: false });
    input.value = '';
    save();
    render();
  }

  document.getElementById('addBtn').onclick = addTask;
  document.getElementById('newTask').addEventListener('keydown', function(e){
    if(e.key === 'Enter') addTask();
  });

  render();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
